<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>數塔 · Number Tower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game">
      <!-- 標題 / 過場 / 結束 -->
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h1 id="overlay-title"></h1>
          <p id="overlay-sub"></p>
          <button id="overlay-btn"></button>
          <div class="version" id="version"></div>
        </div>
      </div>

      <!-- 戰鬥畫面（免識字 · 置中） -->
      <div id="battle" class="battle hidden">
        <div class="topbar">
          <div class="floor-tag">🗼 <span id="floor-num">1</span></div>
          <div class="jokers" id="jokers"></div>
        </div>

        <!-- 戰鬥區：全部置中、由上而下 目標→怪物→狀態→你 -->
        <div class="arena">
          <div id="float-layer" class="float-layer"></div>

          <div class="target-box">🎯 <span id="target-num">24</span></div>

          <div id="monster-art" class="sprite monster-sprite">👹</div>

          <div class="enemy-status">
            <div class="bar-row">
              <span class="ic">❤️</span>
              <div class="bar"><div id="enemy-hp-fill" class="bar-fill enemy"></div></div>
              <span class="bar-num" id="enemy-hp-text">50/50</span>
            </div>
            <div class="bar-row">
              <span class="ic">⚡</span>
              <div class="bar slim"><div id="threat-fill" class="threat-fill"></div></div>
            </div>
          </div>

          <div id="player-art" class="sprite player-sprite">🧙</div>

          <div class="combo-banner" id="combo-banner"></div>
          <div class="narration" id="narration"></div>
        </div>

        <!-- 行動框：大數字牌 + 置中控制列 -->
        <div class="ut-actionbox" id="play-bar">
          <div class="hand" id="hand"></div>
          <div class="control-row">
            <span class="ctl">🟰<b id="sel-sum">0</b></span>
            <span class="ctl">⭐<b id="sel-pattern">×1</b></span>
            <span class="ctl dmg">💥<b id="sel-dmg">0</b></span>
            <button id="play-btn" class="play-btn">⚔️</button>
          </div>
          <div class="player-hp-row">
            <span class="ic">❤️</span>
            <div class="bar"><div id="player-hp-fill" class="bar-fill player"></div></div>
            <span class="bar-num" id="player-hp-text">100/100</span>
          </div>
        </div>
      </div>

      <!-- 獎勵三選一 -->
      <div id="reward" class="reward hidden">
        <h2>戰利品 · 選一張 Joker</h2>
        <div class="reward-cards" id="reward-cards"></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
