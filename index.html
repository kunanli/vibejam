<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>數塔 · Number Tower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game">
      <!-- 標題 / 過場 / 結束 -->
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <div id="cover" class="cover"></div>
          <h1 id="overlay-title"></h1>
          <p id="overlay-sub"></p>
          <button id="overlay-btn"></button>
          <div class="version" id="version"></div>
        </div>
      </div>

      <!-- 戰鬥畫面（免識字 · Balatro 關卡制） -->
      <div id="battle" class="battle hidden">
        <div class="topbar">
          <div class="tower-progress" id="tower-progress"></div>
          <div class="jokers" id="jokers"></div>
        </div>

        <!-- 戰鬥區：大怪物置中，目標/算式緊鄰怪物 -->
        <div class="arena">
          <div class="decor" id="decor"></div>
          <div id="float-layer" class="float-layer"></div>

          <div class="monster-wrap">
            <div id="monster-art" class="sprite monster-sprite">👹</div>
            <div class="remain" id="enemy-remain">137</div>
          </div>

          <!-- 目標 vs 你的總和 + 預估傷害，直接看有沒有達標 -->
          <div class="target-cluster">
            <div class="t-line"><span class="t-ic">🎯</span><span id="target-num">24</span></div>
            <div class="t-line sum" id="sum-box"><span class="t-ic">🟰</span><span id="sel-sum">0</span></div>
            <div class="t-line dmg"><span class="t-ic">💥</span><span id="sel-dmg">0</span><span class="mult" id="sel-pattern">×1</span></div>
          </div>

          <div class="combo-banner" id="combo-banner"></div>
        </div>

        <!-- 行動框：大數字牌 + 出牌/棄牌（含剩餘次數） -->
        <div class="ut-actionbox" id="play-bar">
          <div class="hand" id="hand"></div>
          <div class="control-row">
            <button id="discard-btn" class="ctl-btn discard">🗑 <b id="discards-left">3</b></button>
            <button id="play-btn" class="ctl-btn play">⚔️ <b id="plays-left">5</b></button>
          </div>
        </div>
      </div>

      <!-- 繪本故事頁（每層之間，家長/語音朗讀） -->
      <div id="story" class="story hidden">
        <div class="story-illus" id="story-illus">📖</div>
        <div class="story-text" id="story-text"></div>
        <div class="story-controls">
          <button id="story-read" class="ctl-btn">🔊</button>
          <button id="story-next" class="ctl-btn play">▶</button>
        </div>
      </div>

      <!-- 獎勵三選一 -->
      <div id="reward" class="reward hidden">
        <h2>🎁</h2>
        <p class="reward-sub">選一個作為你的獎勵吧</p>
        <div class="reward-cards" id="reward-cards"></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
