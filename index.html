<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>數塔 · Number Tower</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game">
      <!-- 標題 / 過場 / 結束 -->
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h1 id="overlay-title"></h1>
          <p id="overlay-sub"></p>
          <button id="overlay-btn"></button>
          <div class="version" id="version"></div>
        </div>
      </div>

      <!-- 戰鬥畫面（寶可夢視角） -->
      <div id="battle" class="battle hidden">
        <div class="topbar">
          <div class="floor-tag">第 <span id="floor-num">1</span> 層</div>
          <div class="jokers" id="jokers"></div>
        </div>

        <!-- 對戰場：敵人右上、玩家左下 -->
        <div class="arena">
          <div id="float-layer" class="float-layer"></div>

          <div class="side enemy-side">
            <div class="info-box enemy-box">
              <div class="info-name" id="monster-name">史萊姆</div>
              <div class="info-hp"><div id="enemy-hp-fill" class="info-hp-fill enemy"></div></div>
              <div class="info-row">
                <span id="enemy-hp-text">50/50</span>
                <span class="threat-mini">威脅 <div class="threat-bar"><div id="threat-fill" class="threat-fill"></div></div></span>
              </div>
            </div>
            <div id="monster-art" class="sprite monster-sprite">👹</div>
          </div>

          <div class="side player-side">
            <div id="player-art" class="sprite player-sprite">🧙</div>
            <div class="info-box player-box">
              <div class="info-name">你</div>
              <div class="info-hp"><div id="player-hp-fill" class="info-hp-fill player"></div></div>
              <div class="info-row"><span id="player-hp-text">100/100</span></div>
            </div>
          </div>

          <div class="target-banner">目標 <span id="target-num">24</span></div>
          <div class="combo-banner" id="combo-banner"></div>
        </div>

        <!-- 出牌列：選牌資訊 + 數字手牌 -->
        <div class="play-bar" id="play-bar">
          <div class="play-readout">
            <div class="readout-line">總和 <b id="sel-sum">0</b> · <span id="sel-pattern">—</span></div>
            <div class="readout-dmg">預估 <b id="sel-dmg">0</b></div>
            <button id="play-btn" class="play-btn">出牌 (Enter)</button>
          </div>
          <div class="hand" id="hand"></div>
        </div>
      </div>

      <!-- 獎勵三選一 -->
      <div id="reward" class="reward hidden">
        <h2>戰利品 · 選一張 Joker</h2>
        <div class="reward-cards" id="reward-cards"></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
